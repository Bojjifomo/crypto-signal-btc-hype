# Aturan v2 dikunci SEBELUM backtest dijalankan ulang (17 Nov 2026).
# Ambang ini datang dari temuan v1, bukan dari hasil v2.
# Jangan digeser biar median-nya kelihatan lebih bagus. Kalau lo ubah,
# tests/test_signals.py::test_rules_locked wajib diubah juga, dan laporan
# harus bilang aturannya sudah beda.

[window]
dedupe_days = 14
forward_days = [30, 90, 180]
primary_horizon = 90
backtest_start = "2018-01-01"
in_sample_end = "2021-12-31"
etf_era_start = "2024-01-11"
shuffle_iters = 1000
shuffle_seed = 42

[v1]
# Skor v1 yang gagal: tiga syarat oversold ditumpuk, sinyal kalau ketiganya nyala.
# 200DMA ikut di sini dan SENGAJA dibuang di v2.
fg_below = 20
drawdown_min = 0.25
sma_days = 200
threshold = 3

[v2]
# Inti cuma drawdown dari ATH — satu-satunya sinyal v1 yang ngalahin baseline
# di kedua siklus. Poin drawdown ini TOTAL (bukan ditambah-tambah).
#   dd < 25%            → 0
#   25% <= dd < 50%     → 2  (tranche 1,5x)
#   dd >= 50%           → 3  (tranche 2x)
# 50% itu angka bulat yang ditetapkan di depan, bukan hasil digeser-geser.
drawdown_core = 0.25
drawdown_core_points = 2
drawdown_deep = 0.50
drawdown_deep_points = 3

# Funding 7 hari cuma penegas. Di v1 dia kuat cuma di 2018–21, jadi nggak boleh
# naikkin tranche kalau drawdown-nya belum masuk inti.
funding_lookback_days = 7
funding_min_obs = 4
funding_negative_points = 1
funding_requires_core = true

# ETF cuma buat BTC. Kombo F&G<20 + outflow 5 hari antara $500jt dan $1M
# (n v1 cuma 8) dapat +1, dan cuma kalau inti drawdown sudah nyala.
# Outflow 5 hari >= $1M sendirian bearish di v1: nggak dapat poin, cuma bendera.
fg_combo_below = 20
etf_lookback_prints = 5
etf_lag_days = 1
etf_outflow_min_usd = 500000000
etf_outflow_cap_usd = 1000000000
etf_combo_points = 1
etf_combo_requires_core = true
etf_capitulation_usd = 1000000000
etf_assets = ["BTC"]

[multiplier]
max = 2.0

[[multiplier.bands]]
min_score = 0
mult = 1.0

[[multiplier.bands]]
min_score = 2
mult = 1.5

[[multiplier.bands]]
min_score = 3
mult = 2.0

[dca]
btc_base_idr = 30000000
hype_base_idr = 7500000
# Hard invalidation HYPE: daily close di bawah level ini → tranche 0 hari itu.
# Bukan sticky seumur hidup. HYPE listing jauh di bawah $60; kalau dikunci
# permanen dari close pertama, belinya mati selamanya.
hype_invalidation_close = 60.0

[cycle]
# Lapisan siklus (v3): sisi JUAL + kedalaman value. Ditambah 17 Nov 2026.
# Nggak ngubah tranche v2. Urutannya begini: gue lihat dulu nilai MVRV/Mayer
# di puncak-puncak lama, dan dari situ kelihatan ambang klasik kelewatan 2021
# dan 2025. Itu alasan pakai persentil. Angkanya sendiri (persentil 85/95,
# jendela 4 tahun, tangga 5/10/20%, beli lagi di drawdown 50%) angka bulat yang
# ditulis sebelum event study dan simulasi dijalankan, dan nggak digeser sesudahnya.
# Jujur: semua indikator ini populer JUSTRU karena cocok sama siklus lama,
# jadi nggak ada yang benar-benar luar sampel. Puncak siklus cuma ada 4.
# tests/test_cycle.py::test_cycle_rules_locked ngunci angka-angka ini.
start = "2013-01-01"
forward_days = [90, 180, 365]
primary_horizon = 365
pct_window_days = 1460
pct_min_days = 730
pct_warm = 0.85
pct_hot = 0.95
onchain_lag_days = 1
blowoff_mvrv = 3.5
blowoff_two_year_mult = 5.0
blowoff_points = 2
funding_days = 30
# 30% setahun = kira-kira 3x funding normal (0,01% per 8 jam = 11% setahun).
funding_apr_hot = 0.30
fg_days = 30
fg_hot = 75
# Skor panas dimatiin kalau drawdown sudah masuk inti v2. Satu hari nggak
# boleh sekaligus "beli 1,5x" dan "jual".
heat_gate_drawdown = 0.25
# Value: tiap syarat 1 poin, maks 4. Konteks doang, bukan pengali.
value_drawdown = 0.50
value_mayer_below = 0.8
value_mvrv_below = 1.0
# P/E HYPE = market cap / (pendapatan holder 30 hari x 365).
revenue_days = 30
pe_pct_min_days = 180
# Simulasi: kas hasil jual dibeliin lagi 1/8 tiap tanggal grid selama drawdown >= 50%.
redeploy_drawdown = 0.50
redeploy_fraction = 0.125

# Tangga jual: porsi dari koin yang masih dipegang, per tanggal grid 14 hari.
[[cycle.sell_bands]]
min_heat = 2
fraction = 0.05

[[cycle.sell_bands]]
min_heat = 4
fraction = 0.10

[[cycle.sell_bands]]
min_heat = 6
fraction = 0.20

[cycle.alt]
# HYPE: riwayat < 2 tahun, jadi Mayer pakai ambang tetap. Eksperimental.
mayer_warm = 1.5
mayer_hot = 2.0
# Riwayatnya belum 2 tahun, tabel HYPE dibaca di 90 hari.
primary_horizon = 90

